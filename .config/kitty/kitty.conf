font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

shell_integration disabled

font_size 13.2
background_opacity 0.60

window_padding_width 20
confirm_os_window_close 0



#sarvesh added

copy_on_select yes
mouse_map right click ungrabbed paste_from_clipboard



# Upstream colors {{{
# foreground #a6accd
# background #0d0f16

# Black
# color0 #1b1e28
# color8 #a6accd

# Red
# color1 #d0679d
# color9 #d0679d

# Green
# color2  #5de4c7
# color10 #5de4c7

# Yellow
# color3  #fffac2
# color11 #fffac2

# Blue
# color4  #89ddff
# color12 #add7ff

# Magenta
# color5  #fcc5e9
# color13 #fae4fc

# Cyan
# color6  #add7ff
# color14 #89ddff

# White
# color7  #ffffff
# color15 #ffffff

# Cursor
# cursor #ffffff
# cursor_text_color #1b1e28

# Selection highlight
# selection_foreground none
# selection_background #28344a

# The color for highlighting URLs on mouse-over
# url_color #9ece6a
url_color #f5e0dc

# Window borders
# active_border_color #3d59a1
# inactive_border_color #101014
# bell_border_color #fffac2

# Tab bar
tab_bar_style fade
tab_fade 1
# active_tab_foreground   #3d59a1
# active_tab_background   #16161e
active_tab_font_style   bold
# inactive_tab_foreground #787c99
# inactive_tab_background #16161e
inactive_tab_font_style bold
# tab_bar_background #101014

# Title bar
# macos_titlebar_color #16161e
# }}}

# {{{ Keybindings
map kitty_mod+t     new_tab_with_cwd
# }}


# BEGIN_KITTY_THEME
# Catppuccin Mocha
include current-theme.conf
# END_KITTY_THEME


# Text cursor
cursor_shape beam
cursor_beam_thickness 1.5

cursor_trail 0

include rainbow-trail.conf
